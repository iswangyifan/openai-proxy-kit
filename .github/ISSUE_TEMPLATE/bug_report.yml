name: Bug 报告
description: 提交最小可复现问题，勿包含敏感信息
body:
  - type: markdown
    attributes:
      value: 安全漏洞请按 SECURITY.md 私密报告。不要上传订阅、令牌、真实节点或未脱敏日志。
  - type: input
    id: environment
    attributes:
      label: 软件版本、系统版本和桌面环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤、预期和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已检查并脱敏的错误摘要
