name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-yaml gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 librsvg2-common curl systemd iproute2 libglib2.0-bin util-linux dbus dconf-gsettings-backend gsettings-desktop-schemas xvfb dpkg-dev binutils
      - run: bash packaging/fetch-core.sh
      - run: bash packaging/build-linux.sh
      - run: bash tests/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openai-proxy-kit-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
