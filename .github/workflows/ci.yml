name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-yaml gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 librsvg2-common curl systemd iproute2 libglib2.0-bin util-linux dbus dconf-gsettings-backend gsettings-desktop-schemas xvfb dpkg-dev binutils
      - run: bash packaging/fetch-core.sh
      - run: bash packaging/build-linux.sh
      - run: bash tests/check.sh
      - name: Check package metadata and checksum
        run: |
          dpkg-deb --info dist/openai-proxy-kit_*.deb
          cd dist
          sha256sum -c SHA256SUMS
