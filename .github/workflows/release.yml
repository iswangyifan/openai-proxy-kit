name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor HEAD origin/main
          test -f "docs/releases/v$version.md"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-yaml gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 librsvg2-common curl systemd iproute2 libglib2.0-bin util-linux dbus dconf-gsettings-backend gsettings-desktop-schemas xvfb dpkg-dev binutils
      - run: bash packaging/fetch-core.sh
      - run: bash packaging/build-linux.sh
      - run: bash tests/check.sh
      - name: Prepare complete release attachments
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          git archive --format=tar.gz --prefix="openai-proxy-kit-$version/" HEAD > "dist/openai-proxy-kit-$version-source.tar.gz"
          cp docs/team-onboarding.html "dist/openai-proxy-kit-$version-guide.html"
          cd dist
          sha256sum "openai-proxy-kit_${version}_amd64.deb" CORE-ORIGIN.json MIHOMO-COMPONENTS.json mihomo-source-*.tar.gz mihomo-dependencies-*.tar.gz "openai-proxy-kit-$version-source.tar.gz" "openai-proxy-kit-$version-guide.html" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload and publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true
          else
            gh release create "$tag" --verify-tag --draft --title "Proxy Kit $version" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest
